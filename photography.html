  <style>
    body { font-family: 'Cutive Mono', monospace; }
    h1, h4 { font-family: inherit; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 40px 24px;
      align-items: start;
      padding-bottom: 64px;
    }
    .gallery figure { margin: 0; position: relative; }
    .gallery img { display: block; width: 100%; height: auto; }
    .gallery img.portrait { aspect-ratio: 3 / 2; object-fit: cover; object-position: center; }
    .gallery figcaption {
      position: absolute; bottom: 0; left: 0; right: 0;
      margin: 0; padding: 32px 16px 14px; font-size: 14px; color: white;
      background: linear-gradient(transparent, rgb(0 0 0 / 80%));
      opacity: 0; transition: opacity 150ms; pointer-events: none;
      white-space: pre-wrap; overflow-wrap: anywhere; max-height: 100%; overflow: hidden;
    }
    .gallery figure:hover figcaption, .gallery figure:focus-within figcaption { opacity: 1; }
    @media (hover: none) { .gallery figcaption { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .gallery figcaption { transition: none; } }
    .photo-link { display: block; cursor: zoom-in; }
    .photo-link:focus-visible { outline: 2px solid #111; outline-offset: 6px; }
    .viewer {
      width: min(1500px, 96vw);
      max-width: 96vw;
      max-height: 96vh;
      border: 0;
      padding: 20px;
    }
    .viewer::backdrop { background: rgb(0 0 0 / 85%); }
    .viewer img { display: block; width: 100%; height: 78vh; object-fit: contain; }
    #viewer-caption { margin: 16px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .viewer-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 16px; }
    .viewer button { font: inherit; background: white; color: #111; border: 1px solid #bbb; padding: 8px 12px; cursor: pointer; }
    .viewer button:disabled { opacity: 0.4; cursor: default; }
    .viewer-close { margin-left: auto; }
    body.viewer-open { overflow: hidden; }
    @media (max-width: 900px) {
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>
